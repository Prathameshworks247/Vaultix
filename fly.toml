# Fly.io app config. `fly launch` generates one of these; this repo's version is hand-edited
# to run api/worker/beat as separate process groups from the same image - see the README's
# "Deploying to Fly.io" section for the full walkthrough (fly launch, postgres attach, secrets).
app = "vaultix"
primary_region = "sin"  # pick the region closest to you; `fly platform regions` lists them

[build]

[processes]
app = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'"
worker = "celery -A app.celery_app worker --loglevel=info"
beat = "celery -A app.celery_app beat --loglevel=info"

# Only the "app" process group gets a public HTTP service - worker/beat are internal.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep the API warm; a resume link shouldn't cold-start
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
